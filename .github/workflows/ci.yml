name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  quality:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: 构建
        run: go build ./...

      - name: 静态检查
        run: go vet ./...

      - name: 格式检查
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      - name: 测试
        # -count=1 规避结果缓存，保证每次真实执行
        run: go test ./... -count=1

      - name: 竞态检测
        # 注意：Windows 本地环境 CGO_ENABLED=0 无法验证，本步骤未在提交前跑通，
        # 故暂设为非阻塞。首次在 runner 上跑通后请移除 continue-on-error。
        continue-on-error: true
        run: go test ./... -count=1 -race

      - name: 覆盖率（门禁）
        # 门禁值需逐步上调：当前定在 65%（基线 66.7% 下浮 1.7pp），
        # 每次补测后同步抬高，切忌直接设成理想值导致首日即红
        run: |
          go test ./... -count=1 -coverprofile=coverage.out -covermode=set
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "当前总覆盖率: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 65 ? 0 : 1) }' || {
            echo "覆盖率 ${total}% 低于门禁 65%"
            exit 1
          }

      - name: 上传覆盖率
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
